# Test 

name: Test

# PR post / Update 
# push to main branch
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Run Unity Tests
    runs-on: ubuntu-latest
    steps:
      # Get code form repo
      - uses: actions/checkout@v4
        with:
          lfs: true

      # Cache the library 
      - uses: actions/cache@v4
        with:
          path: thatgamejam2/Library
          key: Library-test-${{ hashFiles('thatgamejam2/Assets/**', 'thatgamejam2/Packages/**') }}
          restore-keys: Library-

      # Unity Play test
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: thatgamejam2
          testMode: all

      # Save 
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts
